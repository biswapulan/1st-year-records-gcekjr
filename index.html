<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCE Keonjhar 1st Year Records</title>
<link rel="icon" id="fav" type="image/png" href="">
<style>
:root{--navy:#1f3a68;--navy-d:#162b4f;--saffron:#e8871e;--green:#1b7f3b;--bg:#f2f4f7;--line:#c9d0da;--ink:#222;--soft:#555;--err:#b00020}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--saffron)}
.head-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{width:48px;height:auto;background:#fff;border-radius:50%;padding:2px}
header h1{font-size:1.05rem;margin:0;letter-spacing:.03em;text-transform:uppercase}
.sub-bar{background:var(--navy-d);color:#dbe4f3;font-size:.85rem}
.sub-bar div{max-width:720px;margin:0 auto;padding:6px 16px}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 16px 30px}
.box{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy)}
.box-title{margin:0;padding:12px 18px;font-size:1.1rem;background:#eef2f8;border-bottom:1px solid var(--line);color:var(--navy)}
.box-body{padding:18px}
.notice{border:1px solid #e6c88f;background:#fff8e8;padding:12px 14px;font-size:.92rem;margin:0 0 16px}
.notice ul{margin:6px 0 0;padding-left:20px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fafbfc;padding:12px 14px;cursor:pointer;margin-bottom:16px}
.check input{width:20px;height:20px;margin-top:2px;flex-shrink:0;cursor:pointer}
.btn{font-family:inherit;font-size:1rem;font-weight:700;padding:10px 24px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--navy-d)}
.btn:disabled{background:#9aa6ba;border-color:#9aa6ba;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy)}
.btn.sec:hover{background:#eef2f8}
.btn.submit{background:var(--green);border-color:var(--green)}
button:focus-visible,input:focus-visible{outline:3px solid #f5b25b;outline-offset:1px}
.step{font-size:.88rem;color:var(--soft);margin-bottom:6px}
.progress{height:6px;background:#e1e6ee;margin-bottom:18px}
.progress div{height:100%;background:var(--navy);transition:width .2s}
label.q{display:block;font-weight:700;margin-bottom:4px}
label.q span{color:var(--err)}
.hint{font-size:.88rem;color:var(--soft);margin:0 0 10px}
.field{width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid #8793a8;border-radius:2px;background:#fff;color:var(--ink)}
.field:focus{border-color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 12px;cursor:pointer;background:#fff}
.opt:hover{background:#f4f7fb}
.opt input{width:18px;height:18px;margin:0;cursor:pointer}
.opt.on{border-color:var(--navy);background:#eef2f8}
.error{color:var(--err);font-size:.88rem;min-height:20px;margin-top:8px}
.nav{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-bottom:16px}
th,td{text-align:left;padding:9px 10px;border:1px solid var(--line);font-size:.95rem;vertical-align:top;word-break:break-word}
th{background:#f4f6fa;width:38%;font-weight:700}
td a{color:var(--navy);font-size:.85rem;margin-left:6px;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.msg{text-align:center;padding:28px 12px}
.msg h2{margin:10px 0 6px;color:var(--green)}
.msg.bad h2{color:var(--err)}
.msg p{margin:0 0 14px;color:var(--soft)}
.tick{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;line-height:54px;margin:0 auto}
.msg.bad .tick{background:var(--err)}
.spinner{width:36px;height:36px;border:4px solid #dfe5ee;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{background:#fff;border-top:1px solid var(--line);text-align:center;font-size:.8rem;color:var(--soft);padding:12px}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <img id="logo" alt="GCE Keonjhar logo">
    <h1>GCE KEONJHAR 1ST YEAR RECORDS</h1>
  </div>
</header>
<div class="sub-bar"><div>Student Record Form · Batch 2026 - 2030</div></div>

<main id="stage"></main>

<footer>Government College of Engineering, Keonjhar · Designed and maintained by CSE, GCE Keonjhar</footer>

<script>
(function(){
  // 1) Google Apps Script Web App URL.
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6usNPsLulUrAHBvif9e-R3fCVWkF8LikeMoEuwhGsk2eOF1kb322lQHtYOZu1yn3t/exec";
  // 2) Paste the logo data URI ("data:image/png;base64,...") from your old file between the quotes.
  var LOGO = "";

  var BATCH = "2026-2030";
  var DEPTS = ["Computer Science & Engineering","Electrical Engineering","Mechanical Engineering","Civil Engineering","Mining Engineering","Mineral Engineering","Metallurgy & Material Engineering"];
  var FIELDS = [
    {id:"name", label:"Name", hint:"Enter your full name.", type:"text", placeholder:"Full name"},
    {id:"roll", label:"Regd. number", hint:"Enter your temporary registration number.", type:"text", placeholder:"Registration number"},
    {id:"department", label:"Department", hint:"Select one option.", type:"select", options:DEPTS},
    {id:"whatsapp", label:"WhatsApp number", hint:"10-digit mobile number.", type:"tel", placeholder:"10-digit WhatsApp number"},
    {id:"email", label:"Email ID", hint:"Used to identify your record.", type:"email", placeholder:"you@example.com"}
  ];

  var logo=document.getElementById("logo");
  if(LOGO){logo.src=LOGO;document.getElementById("fav").href=LOGO}else logo.style.display="none";

  var state={screen:"landing",q:0,a:{},confirmed:false};
  var stage=document.getElementById("stage");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function value(f){return (state.a[f.id]||"").trim()}

  function validate(f,v){
    if(!v) return f.type==="select"?"Please select your department.":"This field is required.";
    if(f.id==="name"&&v.length<3) return "Enter your full name.";
    if(f.id==="roll"&&!/^[A-Za-z0-9\-\/ ]{3,25}$/.test(v)) return "Enter a valid registration number.";
    if(f.id==="whatsapp"&&!/^[6-9]\d{9}$/.test(v.replace(/[\s-]/g,"").replace(/^(\+91|0)/,""))) return "Enter a valid 10-digit mobile number.";
    if(f.id==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "Enter a valid email address.";
    return "";
  }
  function normalize(f,v){
    if(f.id==="whatsapp") return v.replace(/[\s-]/g,"").replace(/^(\+91|0)/,"");
    if(f.id==="email") return v.toLowerCase();
    return v;
  }
  function box(title,body){
    stage.innerHTML='<div class="box"><h2 class="box-title">'+title+'</h2><div class="box-body">'+body+'</div></div>';
  }
  function render(){
    ({landing:landing,question:question,review:review,submitting:submitting,success:success,failure:failure})[state.screen]();
    window.scrollTo(0,0);
  }

  function landing(){
    box("1st Year Student Record for the batch 2026 - 2030",
      '<p class="notice"><strong>Instructions</strong><ul><li>This form is only for 1st year students of the 2026 - 2030 batch.</li><li>There are 5 short questions, followed by a review step.</li><li>Keep your registration number, WhatsApp number and email ID ready.</li></ul></p>'+
      '<label class="check"><input type="checkbox" id="chk"'+(state.confirmed?' checked':'')+'><span>I confirm that I belong to the 1st year only (Batch 2026 - 2030).</span></label>'+
      '<button class="btn" id="go"'+(state.confirmed?'':' disabled')+'>Start</button>');
    var chk=document.getElementById("chk"),go=document.getElementById("go");
    chk.onchange=function(){state.confirmed=chk.checked;go.disabled=!chk.checked};
    go.onclick=function(){if(state.confirmed){state.screen="question";state.q=0;render()}};
  }

  function question(){
    var f=FIELDS[state.q],last=state.q===FIELDS.length-1,input;
    if(f.type==="select"){
      var cur=state.a[f.id]||"";
      input='<div class="opts" role="radiogroup">'+f.options.map(function(o){
        return '<label class="opt'+(cur===o?' on':'')+'"><input type="radio" name="dept" value="'+esc(o)+'"'+(cur===o?' checked':'')+'><span>'+esc(o)+'</span></label>';
      }).join("")+'</div>';
    } else {
      input='<input class="field" id="inp" type="'+f.type+'" placeholder="'+esc(f.placeholder)+'" value="'+esc(state.a[f.id]||"")+'" autocomplete="off">';
    }
    box("Step "+(state.q+1)+" of "+FIELDS.length,
      '<div class="progress"><div style="width:'+((state.q+1)/FIELDS.length*100)+'%"></div></div>'+
      '<label class="q" for="inp">'+esc(f.label)+' <span>*</span></label><p class="hint">'+esc(f.hint)+'</p>'+input+
      '<div class="error" id="err" role="alert"></div>'+
      '<div class="nav"><button class="btn sec" id="back">Back</button><button class="btn" id="next">'+(last?"Review":"Next")+'</button></div>');

    var inp=document.getElementById("inp"),err=document.getElementById("err");
    if(inp) inp.focus();
    if(f.type==="select"){
      var radios=stage.querySelectorAll("input[name=dept]");
      radios.forEach(function(r){r.onchange=function(){
        state.a[f.id]=r.value; err.textContent="";
        stage.querySelectorAll(".opt").forEach(function(l){l.classList.toggle("on",l.contains(r)&&r.checked)});
      }});
    }
    function capture(){if(inp)state.a[f.id]=inp.value}
    document.getElementById("back").onclick=function(){
      capture(); if(state.q===0)state.screen="landing"; else state.q--; render();
    };
    document.getElementById("next").onclick=function(){
      capture();
      var e=validate(f,value(f));
      if(e){err.textContent=e;return}
      state.a[f.id]=normalize(f,value(f));
      if(last)state.screen="review"; else state.q++;
      render();
    };
    if(inp){
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();document.getElementById("next").click()}});
      inp.addEventListener("input",function(){err.textContent=""});
    }
  }

  function review(){
    var rows='<tr><th>Batch</th><td>2026 - 2030 (1st Year)</td></tr>'+FIELDS.map(function(f,i){
      return '<tr><th>'+esc(f.label)+'</th><td>'+esc(value(f))+' <button class="edit" data-i="'+i+'" style="display:none"></button><a data-i="'+i+'" role="button" tabindex="0">Edit</a></td></tr>';
    }).join("");
    box("Review your details",
      '<table>'+rows+'</table><div class="row"><button class="btn submit" id="sub">Submit</button><button class="btn sec" id="bk">Back</button></div>');
    stage.querySelectorAll("a[data-i]").forEach(function(b){
      function go(){state.q=+b.dataset.i;state.screen="question";render()}
      b.onclick=go; b.onkeydown=function(e){if(e.key==="Enter")go()};
    });
    document.getElementById("bk").onclick=function(){state.q=FIELDS.length-1;state.screen="question";render()};
    document.getElementById("sub").onclick=function(){state.screen="submitting";render();send()};
  }

  function submitting(){
    box("Submitting",'<div class="msg"><div class="spinner"></div><p>Please wait and do not close this page.</p></div>');
  }
  function success(){
    box("Submitted",'<div class="msg"><div class="tick">&#10003;</div><h2>Thank you!</h2><p>Thank you for filling out this form.</p></div>');
  }
  function failure(){
    box("Submission failed",'<div class="msg bad"><div class="tick">!</div><h2>Could not submit</h2><p>Your details could not be saved. Check your connection and try again.</p>'+
      '<div class="row" style="justify-content:center"><button class="btn" id="retry">Try Again</button><button class="btn sec" id="ed">Edit Details</button></div></div>');
    document.getElementById("retry").onclick=function(){state.screen="submitting";render();send()};
    document.getElementById("ed").onclick=function(){state.screen="review";render()};
  }

  function send(){
    var p={batch:BATCH,year:"1st Year"};
    FIELDS.forEach(function(f){p[f.id]=value(f)});
    fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
      .then(function(r){return r.json()})
      .then(function(j){state.screen=(j&&j.status==="success")?"success":"failure";render()})
      .catch(function(){state.screen="failure";render()});
  }

  render();
})();
</script>
</body>
</html>
